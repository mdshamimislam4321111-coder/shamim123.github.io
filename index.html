<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Love ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #020001;
      color: white;
      font-family: Inter, sans-serif;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 600px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .glow {
      position: absolute;

      width: 550px;
      height: 550px;

      left: 50%;
      top: 8%;

      transform: translateX(-50%);

      background: radial-gradient(
        circle,
        rgba(255, 0, 50, 0.18),
        transparent 68%
      );

      filter: blur(25px);
    }


    /* =================================================
       LOADING BOX
    ================================================= */

    .loading {
      position: absolute;

      z-index: 20;

      width: min(90%, 410px);

      padding: 25px 25px 30px;

      text-align: center;

      border: 1px solid rgba(255, 0, 60, 0.25);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(45, 0, 10, 0.75),
          rgba(10, 0, 4, 0.9)
        );

      box-shadow:
        0 0 40px rgba(255, 0, 50, 0.08),
        inset 0 0 30px rgba(255, 0, 50, 0.04);

      transition: 0.8s ease;
    }

    .loading.hide {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
    }


    /* =================================================
       RED CANDLE
    ================================================= */

    .red-candle {
      position: relative;

      width: 90px;
      height: 120px;

      margin: 0 auto 10px;

      display: flex;
      justify-content: center;
      align-items: flex-end;

      animation: candleFloat 3s ease-in-out infinite;

      filter:
        drop-shadow(
          0 0 15px rgba(255, 0, 40, 0.45)
        );
    }


    /* Candle body */

    .candle-body {
      position: relative;

      z-index: 3;

      width: 30px;
      height: 65px;

      border-radius: 5px 5px 4px 4px;

      background:
        linear-gradient(
          90deg,
          #5c000c,
          #ff1740,
          #970015
        );

      box-shadow:
        inset 5px 0 8px rgba(255,255,255,0.08),
        inset -5px 0 8px rgba(50,0,8,0.4);
    }


    /* Wick */

    .candle-body::before {
      content: "";

      position: absolute;

      top: -11px;
      left: 50%;

      width: 3px;
      height: 13px;

      transform: translateX(-50%);

      background: #111;

      border-radius: 3px;
    }


    /* Candle top */

    .candle-body::after {
      content: "";

      position: absolute;

      top: -4px;
      left: 50%;

      width: 36px;
      height: 8px;

      transform: translateX(-50%);

      border-radius: 50%;

      background: #bd001f;

      box-shadow:
        0 0 10px rgba(255, 20, 55, 0.4);
    }


    /* Flame */

    .flame {
      position: absolute;

      z-index: 5;

      top: 7px;
      left: 50%;

      width: 20px;
      height: 31px;

      transform: translateX(-50%);

      transform-origin: bottom center;

      border-radius:
        55% 45% 55% 45%;

      background:
        linear-gradient(
          to top,
          #ff163d,
          #ff3c58,
          #ffd5dc
        );

      box-shadow:
        0 0 8px #ff173c,
        0 0 20px rgba(255,0,45,0.85),
        0 0 40px rgba(255,0,45,0.4);

      animation:
        flameMove .75s ease-in-out infinite alternate;
    }


    /* Flame center */

    .flame::after {
      content: "";

      position: absolute;

      left: 50%;
      bottom: 4px;

      width: 7px;
      height: 13px;

      transform: translateX(-50%);

      border-radius: 50%;

      background: #fff2f4;

      box-shadow:
        0 0 6px white;
    }


    /* Red light */

    .candle-glow {
      position: absolute;

      z-index: 1;

      top: -15px;
      left: 50%;

      width: 120px;
      height: 120px;

      transform: translateX(-50%);

      border-radius: 50%;

      background:
        rgba(255, 0, 45, 0.10);

      filter: blur(20px);

      animation:
        candleGlow 1.5s ease-in-out infinite alternate;
    }


    @keyframes flameMove {

      from {
        transform:
          translateX(-50%)
          rotate(-5deg)
          scaleY(.94);
      }

      to {
        transform:
          translateX(-50%)
          rotate(5deg)
          scaleY(1.06);
      }

    }


    @keyframes candleGlow {

      from {
        opacity: .4;

        transform:
          translateX(-50%)
          scale(.85);
      }

      to {
        opacity: .95;

        transform:
          translateX(-50%)
          scale(1.15);
      }

    }


    @keyframes candleFloat {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }

    }


    /* =================================================
       MINI ROSE
    ================================================= */

    .mini-rose {
      position: relative;

      width: 55px;
      height: 80px;

      margin: auto;
    }

    .mini-flower {
      position: absolute;

      left: 13px;
      top: 0;

      width: 30px;
      height: 30px;
    }

    .mini-petal {
      position: absolute;

      width: 19px;
      height: 27px;

      background:
        linear-gradient(
          135deg,
          #ff1747,
          #80001d
        );

      border-radius: 100% 0 100% 0;

      transform-origin: bottom right;
    }

    .mini-petal:nth-child(1) {
      transform: rotate(0deg);
    }

    .mini-petal:nth-child(2) {
      transform: rotate(90deg);
    }

    .mini-petal:nth-child(3) {
      transform: rotate(180deg);
    }

    .mini-petal:nth-child(4) {
      transform: rotate(270deg);
    }

    .mini-stem {
      position: absolute;

      top: 24px;
      left: 26px;

      width: 4px;
      height: 50px;

      border-radius: 5px;

      background: #0b9a43;
    }


    .loading h1 {
      margin-top: 5px;

      font-family: Georgia, serif;

      font-size: 28px;
    }

    .loading p {
      color: #ddd;

      font-size: 12px;

      font-family: monospace;
    }


    /* =================================================
       PROGRESS
    ================================================= */

    .progress {
      width: 100%;

      height: 7px;

      margin: 24px 0 12px;

      background:
        rgba(255,255,255,0.08);

      border-radius: 10px;

      overflow: hidden;
    }

    .progress span {
      display: block;

      width: 0;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #ff003c,
          #ff2355
        );

      box-shadow:
        0 0 12px #ff003c;

      animation:
        load 2.5s linear forwards;
    }

    @keyframes load {

      to {
        width: 100%;
      }

    }


    /* =================================================
       BLOOM BUTTON
    ================================================= */

    .bloom-btn {
      width: 100%;

      margin-top: 25px;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #ff003c,
          #ed0041
        );

      color: white;

      font-weight: 700;

      letter-spacing: 1px;

      cursor: pointer;

      box-shadow:
        0 0 20px rgba(255,0,60,0.25);

      transition: 0.25s;
    }

    .bloom-btn:hover {

      transform: translateY(-2px);

      box-shadow:
        0 0 30px rgba(255,0,60,0.45);
    }


    /* =================================================
       LOVE SCENE
    ================================================= */

    .love-scene {
      position: relative;

      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      opacity: 0;

      transform: translateY(20px);

      pointer-events: none;

      transition:
        opacity 1s ease,
        transform 1s ease;
    }

    .love-scene.show {

      opacity: 1;

      transform: translateY(0);

      pointer-events: auto;
    }


    /* =================================================
       ROSE
    ================================================= */

    .rose {

      position: relative;

      width: 330px;
      height: 390px;

      display: flex;

      justify-content: center;
    }

    .flower {

      position: absolute;

      top: 40px;

      width: 310px;
      height: 220px;

      animation:
        sway 4s ease-in-out infinite;
    }

    @keyframes sway {

      0%,100% {
        transform: rotate(-1deg);
      }

      50% {
        transform: rotate(1deg);
      }

    }


    .petal {

      position: absolute;

      left: 50%;

      bottom: 30px;

      width: 100px;
      height: 135px;

      background:
        radial-gradient(
          ellipse at 50% 75%,
          #ff173f 0%,
          #d9002c 45%,
          #720017 100%
        );

      border-radius:
        80% 20% 65% 35% /
        75% 35% 65% 25%;

      transform-origin: bottom center;

      box-shadow:
        inset 0 -12px 20px rgba(70,0,15,0.3),
        0 0 15px rgba(255,0,45,0.12);

      opacity: 0;

      animation:
        bloom 1.5s cubic-bezier(.2,.8,.2,1) forwards;
    }


    .petal:nth-child(1) {
      --rotate: 0deg;
      animation-delay: .1s;
    }

    .petal:nth-child(2) {
      --rotate: -35deg;
      animation-delay: .2s;
    }

    .petal:nth-child(3) {
      --rotate: 35deg;
      animation-delay: .3s;
    }

    .petal:nth-child(4) {
      --rotate: -65deg;
      animation-delay: .4s;
    }

    .petal:nth-child(5) {
      --rotate: 65deg;
      animation-delay: .5s;
    }

    .petal:nth-child(6) {
      --rotate: -90deg;
      animation-delay: .6s;
    }

    .petal:nth-child(7) {
      --rotate: 90deg;
      animation-delay: .7s;
    }

    .petal:nth-child(8) {
      --rotate: 180deg;
      animation-delay: .8s;
    }


    @keyframes bloom {

      0% {

        opacity: 0;

        transform:
          translateX(-50%)
          scale(.15)
          rotate(0deg);
      }

      70% {
        opacity: 1;
      }

      100% {

        opacity: 1;

        transform:
          translateX(-50%)
          scale(1)
          rotate(var(--rotate));
      }

    }


    .stem {

      position: absolute;

      top: 210px;
      left: 50%;

      width: 7px;
      height: 155px;

      transform:
        translateX(-50%);

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #08762d,
          #15ae49,
          #076c29
        );
    }


    .leaf {

      position: absolute;

      width: 75px;
      height: 35px;

      background:
        linear-gradient(
          135deg,
          #13a848,
          #075f2a
        );

      border-radius:
        100% 0 100% 0;
    }

    .leaf.left {

      top: 265px;
      left: 85px;

      transform:
        rotate(-25deg);
    }

    .leaf.right {

      top: 295px;
      right: 80px;

      transform:
        scaleX(-1)
        rotate(-25deg);
    }


    /* =================================================
       TEXT
    ================================================= */

    .subtitle {

      margin-top: -20px;

      color: #d68da0;

      font-size: 12px;

      letter-spacing: 5px;

      text-transform: uppercase;
    }

    .love-title {

      margin-top: 7px;

      font-family:
        "Great Vibes",
        cursive;

      font-size: 50px;

      font-weight: 400;

      color: #e8b1bd;

      text-shadow:
        0 0 20px rgba(255,50,90,0.15);
    }

    .love-title span {

      font-family: Georgia, serif;

      font-size: 25px;
    }


    .note-btn {

      margin-top: 18px;

      padding: 10px 24px;

      border: 1px solid
        rgba(255,0,60,0.2);

      border-radius: 25px;

      background:
        rgba(50,0,15,0.3);

      color: #ddd;

      cursor: pointer;

      transition: .3s;
    }

    .note-btn:hover {

      background:
        rgba(255,0,50,0.1);

      border-color:
        rgba(255,0,60,0.4);
    }


    /* =================================================
       FALLING PETALS
    ================================================= */

    .falling {

      position: absolute;

      inset: 0;

      overflow: hidden;

      pointer-events: none;
    }

    .falling span {

      position: absolute;

      top: -20px;

      width: 10px;
      height: 16px;

      background: #ff1747;

      border-radius:
        100% 0 100% 0;

      opacity: .75;

      animation:
        fall linear infinite;
    }

    .falling span:nth-child(1) {
      left: 15%;
      animation-duration: 6s;
      animation-delay: 1s;
    }

    .falling span:nth-child(2) {
      left: 30%;
      animation-duration: 7s;
      animation-delay: 2s;
    }

    .falling span:nth-child(3) {
      left: 70%;
      animation-duration: 5s;
      animation-delay: .5s;
    }

    .falling span:nth-child(4) {
      left: 82%;
      animation-duration: 8s;
      animation-delay: 2.5s;
    }

    .falling span:nth-child(5) {
      left: 92%;
      animation-duration: 6s;
      animation-delay: 3s;
    }


    @keyframes fall {

      from {

        top: -20px;

        transform:
          rotate(0deg);
      }

      to {

        top: 110%;

        transform:
          rotate(500deg);
      }

    }


    /* =================================================
       MODAL
    ================================================= */

    .modal {

      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(0,0,0,.72);

      backdrop-filter:
        blur(5px);

      opacity: 0;

      visibility: hidden;

      transition: .4s;
    }

    .modal.open {

      opacity: 1;

      visibility: visible;
    }


    .note {

      position: relative;

      width: min(90vw,600px);

      max-height: 80vh;

      padding: 45px 38px;

      overflow: auto;

      border:
        1px solid rgba(255,0,60,.25);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(35,0,12,.97),
          rgba(8,0,4,.98)
        );

      box-shadow:
        0 0 60px rgba(255,0,50,.1);

      transform:
        scale(.9);

      transition: .4s;
    }

    .modal.open .note {

      transform:
        scale(1);
    }


    .close {

      position: absolute;

      top: 14px;
      right: 18px;

      width: 32px;
      height: 32px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255,255,255,.05);

      color: #aaa;

      font-size: 22px;

      cursor: pointer;
    }


    .note h2 {

      margin-bottom: 18px;

      font-family:
        "Great Vibes",
        cursive;

      font-size: 40px;

      font-weight: 400;

      color: #ff8eae;
    }


    .note-text {

      color: #eee;

      font-size: 15px;

      line-height: 1.8;
    }


    .note-text h2 {

      margin: 0 0 25px 0;

      font-family:
        "Great Vibes",
        cursive;

      font-size: 25px;

      font-weight: 400;

      line-height: 1.7;

      color: #eee;

      text-shadow:
        0 0 10px
        rgba(255,100,130,.08);
    }


    .signature {

      margin-top: 25px;

      font-family:
        "Great Vibes",
        cursive;

      font-size: 28px;

      color: #e99bad;
    }


    /* =================================================
       MOBILE
    ================================================= */

    @media (max-width:600px) {

      .loading {

        padding:
          20px 20px 25px;
      }

      .red-candle {

        transform:
          scale(.9);
      }

      .rose {

        transform:
          scale(.82);

        margin-bottom:
          -50px;
      }

      .subtitle {

        font-size: 9px;

        letter-spacing: 3px;
      }

      .love-title {

        font-size: 40px;
      }

      .note {

        padding:
          40px 25px;
      }

    }

  </style>

</head>


<body>

  <main class="screen">

    <div class="glow"></div>


    <!-- =================================================
         LOADING SCREEN
    ================================================= -->

    <section class="loading" id="loading">


      <!-- RED CANDLE -->

      <div class="red-candle">

        <div class="candle-glow"></div>

        <div class="flame"></div>

        <div class="candle-body"></div>

      </div>


      <!-- MINI ROSE -->

      <div class="mini-rose">

        <div class="mini-flower">

          <i class="mini-petal"></i>
          <i class="mini-petal"></i>
          <i class="mini-petal"></i>
          <i class="mini-petal"></i>

        </div>

        <div class="mini-stem"></div>

      </div>


      <h1>
        Loading Love
      </h1>


      <div class="progress">

        <span></span>

      </div>


      <p>
        Ready to bloom for Love ♡
      </p>


      <button
        class="bloom-btn"
        id="bloomBtn">

        TAP TO BLOOM FOR LOVE ♥

      </button>

    </section>



    <!-- =================================================
         MAIN LOVE SECTION
    ================================================= -->

    <section
      class="love-scene"
      id="loveScene">


      <div class="falling">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

      </div>


      <!-- ROSE -->

      <div class="rose">

        <div class="flower">

          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>

        </div>


        <div class="stem"></div>

        <div class="leaf left"></div>

        <div class="leaf right"></div>

      </div>


      <p class="subtitle">

        EVERY PETAL BLOOMS WITH LOVE

      </p>


      <h1 class="love-title">

        for love
        <span>♥</span>

      </h1>


      <button
        class="note-btn"
        id="noteBtn">

        💌 &nbsp; READ MY NOTE

      </button>

    </section>



    <!-- =================================================
         NOTE POPUP
    ================================================= -->

    <div
      class="modal"
      id="modal">


      <div class="note">


        <button
          class="close"
          id="closeBtn">

          ×

        </button>


        <h2>
          Dear Love,
        </h2>


        <div
          class="note-text"
          id="noteText">
        </div>


        <div class="signature">

          Yours forever,
          <br>

          ❤️

        </div>

      </div>

    </div>


  </main>



  <!-- =================================================
       JAVASCRIPT
  ================================================= -->

  <script>


    /* =================================================
       BLOOM BUTTON
    ================================================= */

    const loading =
      document.getElementById("loading");

    const loveScene =
      document.getElementById("loveScene");

    const bloomBtn =
      document.getElementById("bloomBtn");


    bloomBtn.addEventListener(
      "click",
      function () {

        loading.classList.add("hide");


        setTimeout(
          function () {

            loveScene.classList.add("show");

          },
          700
        );

      }
    );



    /* =================================================
       NOTE POPUP
    ================================================= */

    const modal =
      document.getElementById("modal");

    const noteBtn =
      document.getElementById("noteBtn");

    const closeBtn =
      document.getElementById("closeBtn");

    const noteText =
      document.getElementById("noteText");



    /* =================================================
       LOVE LETTER
    ================================================= */

    const messages = [

      "তোমাকে কীভাবে ভালোবাসি, সেটা হয়তো কোনো শব্দ দিয়ে পুরোপুরি বোঝানো সম্ভব নয়। তবুও প্রতিদিন মনে হয়, তোমার জন্য আরও কিছু বলা বাকি থেকে যায়।",

      "তুমি আমার জীবনে আসার পর থেকে ছোট ছোট মুহূর্তগুলোরও যেন আলাদা একটা অর্থ তৈরি হয়েছে। তোমার একটা হাসি আমার মন ভালো করে দিতে পারে, তোমার একটা কথা সারাদিন আমার মনে থেকে যায়। কখনো কখনো শুধু তোমার কথা ভাবতেই আমার মুখে অজান্তেই হাসি চলে আসে।",

      "জানো, আমি তোমার কাছে কোনো বড় প্রতিশ্রুতি দিতে চাই না। শুধু এটুকু বলতে চাই—জীবনের সুন্দর দিনগুলোতে যেমন তোমার পাশে থাকতে চাই, তেমনি কঠিন দিনগুলোতেও তোমার হাতটা শক্ত করে ধরে রাখতে চাই।",

      "তোমার সঙ্গে কাটানো প্রতিটি মুহূর্ত আমার কাছে খুব আপন। তোমার অভিমান, তোমার হাসি, তোমার নীরবতা—সবকিছুই আমার কাছে আলাদা রকমের প্রিয়।",

      "এই ছোট্ট গোলাপটা হয়তো সত্যিকারের গোলাপ নয়, কিন্তু এর প্রতিটি পাপড়ির সঙ্গে আমার মনের একটা করে কথা জড়িয়ে আছে।"

    ];



    /* =================================================
       OPEN NOTE
    ================================================= */

    noteBtn.addEventListener(
      "click",
      function () {

        modal.classList.add("open");

        noteText.innerHTML = "";

        let paragraphIndex = 0;


        function typeParagraph() {

          if (
            paragraphIndex >=
            messages.length
          ) {

            return;

          }


          const heading =
            document.createElement("h2");


          noteText.appendChild(
            heading
          );


          const text =
            messages[paragraphIndex];


          let characterIndex = 0;


          function typeCharacter() {

            if (
              characterIndex <
              text.length
            ) {

              heading.textContent +=
                text.charAt(
                  characterIndex
                );


              characterIndex++;


              /* TYPE SPEED */

              setTimeout(
                typeCharacter,
                65
              );

            }

            else {

              paragraphIndex++;


              /* NEXT PARAGRAPH */

              setTimeout(
                typeParagraph,
                900
              );

            }

          }


          typeCharacter();

        }


        typeParagraph();

      }
    );



    /* =================================================
       CLOSE NOTE
    ================================================= */

    closeBtn.addEventListener(
      "click",
      function () {

        modal.classList.remove(
          "open"
        );

      }
    );



    /* =================================================
       CLICK OUTSIDE TO CLOSE
    ================================================= */

    modal.addEventListener(
      "click",
      function (event) {

        if (
          event.target === modal
        ) {

          modal.classList.remove(
            "open"
          );

        }

      }
    );


  </script>
